name: Add multilingual UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-multilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply multilingual UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="language-switcher"' not in s:
              css='''\n  .language-switcher{position:fixed;top:14px;left:14px;z-index:60;display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:10px;background:rgba(26,26,38,.92);backdrop-filter:blur(6px)}\n  .lang-btn{min-width:34px;height:28px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s}\n  .lang-btn:hover{color:var(--text)}\n  .lang-btn.active{background:var(--accent);color:#0a0a0f}\n  @media(max-width:520px){.language-switcher{top:10px;left:10px}.settings-btn{top:10px;right:10px}.lang-btn{min-width:31px;padding:0 6px;font-size:9px}}\n'''
              s=s.replace('  /* ======================== SETTINGS ======================== */',css+'  /* ======================== SETTINGS ======================== */',1)
              html='''<!-- Language selector -->\n<div class="language-switcher" id="language-switcher" role="group" aria-label="Language">\n  <button class="lang-btn" data-lang="id" type="button">ID</button>\n  <button class="lang-btn" data-lang="en" type="button">EN</button>\n  <button class="lang-btn" data-lang="ja" type="button">JP</button>\n  <button class="lang-btn" data-lang="ko" type="button">KR</button>\n</div>\n\n'''
              s=s.replace('<!-- Settings button (global) -->',html+'<!-- Settings button (global) -->',1)
              pairs={
              'class="home-subtitle"':'class="home-subtitle" data-i18n="homeSubtitle"',
              'class="form-label" for="username-input"':'class="form-label" data-i18n="usernameLabel" for="username-input"',
              'class="input-prefix"':'class="input-prefix" data-i18n="helloPrefix"',
              'class="input-hint"':'class="input-hint" data-i18n="usernameHint"',
              'class="btn-start" id="btn-start" disabled':'class="btn-start" id="btn-start" disabled data-i18n="startChallenge"',
              '<h2>PICK YOUR POISON</h2>':'<h2 data-i18n="pickPoison">PICK YOUR POISON</h2>',
              '<p id="diff-greeting">Ready, player?</p>':'<p id="diff-greeting" data-i18n="readyPlayer">Ready, player?</p>',
              '<div class="op-section-label">Operation</div>':'<div class="op-section-label" data-i18n="operation">Operation</div>',
              '<div class="op-section-label">Time</div>':'<div class="op-section-label" data-i18n="time">Time</div>',
              'Leaderboard <span id="season-badge"':'<span data-i18n="leaderboard">Leaderboard</span> <span id="season-badge"',
              '      Achievements <span id="ach-count"':'      <span data-i18n="achievements">Achievements</span> <span id="ach-count"',
              '<div class="lb-empty">loading scores...</div>':'<div class="lb-empty" data-i18n="loadingScores">loading scores...</div>',
              '<div class="answer-label">your answer</div>':'<div class="answer-label" data-i18n="yourAnswer">your answer</div>',
              '<div class="quiz-hint">press ENTER to submit · leave blank to skip</div>':'<div class="quiz-hint" data-i18n="quizHint">press ENTER to submit · leave blank to skip</div>',
              '<div class="countdown-label">Get Ready!</div>':'<div class="countdown-label" data-i18n="getReady">Get Ready!</div>',
              '<div class="score-breakdown-title">Score Breakdown</div>':'<div class="score-breakdown-title" data-i18n="scoreBreakdown">Score Breakdown</div>',
              '<span>Question Review</span>':'<span data-i18n="questionReview">Question Review</span>',
              'id="btn-play-again">PLAY AGAIN':'id="btn-play-again" data-i18n="playAgain">PLAY AGAIN',
              'id="btn-change-player">Change Player':'id="btn-change-player" data-i18n="changePlayer">Change Player',
              'id="btn-view-lb">View Leaderboard':'id="btn-view-lb" data-i18n="viewLeaderboard">View Leaderboard',
              '<h2>SETTINGS <button':'<h2><span data-i18n="settings">SETTINGS</span> <button',
              '<h3>Appearance</h3>':'<h3 data-i18n="appearance">Appearance</h3>',
              '<h3>Gameplay</h3>':'<h3 data-i18n="gameplay">Gameplay</h3>',
              '<h3>Data</h3>':'<h3 data-i18n="data">Data</h3>',
              '<h2 id="pause-title">PAUSED</h2>':'<h2 id="pause-title" data-i18n="paused">PAUSED</h2>',
              '<p id="pause-msg">Game paused.</p>':'<p id="pause-msg" data-i18n="gamePaused">Game paused.</p>',
              'id="pause-resume-btn" style="width:auto;padding:12px 28px;font-size:16px;">RESUME':'id="pause-resume-btn" style="width:auto;padding:12px 28px;font-size:16px;" data-i18n="resume">RESUME',
              }
              for a,b in pairs.items(): s=s.replace(a,b,1)
              p.write_text(s,encoding='utf-8')
          PY

          cat > api/locale.js <<'JS'
          export const config = { runtime: 'edge' };
          const COUNTRY_TO_LANGUAGE = { ID: 'id', JP: 'ja', KR: 'ko' };
          export default function handler(request) {
            const country = (request.headers.get('x-vercel-ip-country') || '').toUpperCase();
            const acceptLanguage = (request.headers.get('accept-language') || '').toLowerCase();
            let language = COUNTRY_TO_LANGUAGE[country] || '';
            if (!language) {
              if (acceptLanguage.startsWith('id')) language = 'id';
              else if (acceptLanguage.startsWith('ja')) language = 'ja';
              else if (acceptLanguage.startsWith('ko')) language = 'ko';
              else language = 'en';
            }
            return new Response(JSON.stringify({ country: country || null, language, source: COUNTRY_TO_LANGUAGE[country] ? 'network' : 'fallback' }), { status: 200, headers: { 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store, max-age=0' } });
          }
JS

          python - <<'PY'
