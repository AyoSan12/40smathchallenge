      - name: Verify, remove one-time workflow, and commit
        shell: bash
        run: |
          grep -q 'id="language-switcher"' index.html
          grep -q 'MULTILINGUAL UI' index.html
          grep -q 'const CURRENT_SEASON = 1;' index.html
          test -f api/locale.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api/locale.js
          git rm .github/workflows/add-multilingual.yml
          git commit -m 'Add ID EN JP KR multilingual UI [skip multilingual]'
          git push
