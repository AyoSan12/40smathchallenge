name: Apply competitive client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text()
          tag = '<script src="/competitive.js"></script>'
          marker = '<script>\n// ======================== DOM ID OBFUSCATION ========================'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('Index marker not found')
              s = s.replace(marker, tag + '\n' + marker, 1)
              index.write_text(s)

          api = Path('api/competitive.js')
          a = api.read_text()
          old = "return json(200,{ok:true,status:'finished',match:publicMatch(m,identity.playerId),result:m.finalResult,profile:{...p,rank:rankName(p.rankIndex),rankColor:rankColor(p.rankIndex)}});"
          new = "const myResult=m.finalResult?.winnerSide==='draw'?'draw':(identity.playerId===m.players.a.id?m.finalResult?.resultA:m.finalResult?.resultB); const myRating=identity.playerId===m.players.a.id?m.finalResult?.a:m.finalResult?.b; return json(200,{ok:true,status:'finished',match:publicMatch(m,identity.playerId),result:{...m.finalResult,myResult,myRating},profile:{...p,rank:rankName(p.rankIndex),rankColor:rankColor(p.rankIndex)}});"
          if old in a:
              a = a.replace(old,new,1)
          old2 = "const result=await finalize(m); const p=await getProfile(identity.playerId,identity.username); return json(200,{ok:true,status:'finished',result,profile:{...p,rank:rankName(p.rankIndex),rankColor:rankColor(p.rankIndex)},match:publicMatch(m,identity.playerId)});"
          new2 = "const result=await finalize(m); const p=await getProfile(identity.playerId,identity.username); const myResult=result?.winnerSide==='draw'?'draw':(identity.playerId===m.players.a.id?result?.resultA:result?.resultB); const myRating=identity.playerId===m.players.a.id?result?.a:result?.b; return json(200,{ok:true,status:'finished',result:{...result,myResult,myRating},profile:{...p,rank:rankName(p.rankIndex),rankColor:rankColor(p.rankIndex)},match:publicMatch(m,identity.playerId)});"
          if old2 in a:
              a = a.replace(old2,new2,1)
          api.write_text(a)

          client = Path('competitive.js')
          c = client.read_text()
          c = c.replace("const side=r.resultA||'draw';const win=side==='win',loss=side==='loss';", "const side=r.myResult||r.resultA||'draw';const win=side==='win',loss=side==='loss';")
          c = c.replace("document.getElementById('cr-me').textContent=r.scores?.a?.correct||d.match?.me?.correct||0;document.getElementById('cr-opp').textContent=r.scores?.b?.correct||d.match?.opponent?.correct||0;const delta=r.a?.rrDelta||0;", "document.getElementById('cr-me').textContent=d.match?.me?.correct||0;document.getElementById('cr-opp').textContent=d.match?.opponent?.correct||0;const delta=r.myRating?.rrDelta||r.a?.rrDelta||0;")
          client.write_text(c)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html api/competitive.js competitive.js
          git diff --cached --quiet && CHANGED=0 || CHANGED=1
          if [ "$CHANGED" = "1" ]; then
            git commit -m "Integrate competitive mode UI and identity-safe results"
            git push
          fi
          rm -f .github/workflows/apply-competitive-client.yml
          git add .github/workflows/apply-competitive-client.yml
          git commit -m "Remove one-time competitive patch workflow" || true
          git push || true
