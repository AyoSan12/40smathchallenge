name: Update competitive ranks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[skip-rank-names]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const files = ['api/competitive.js', 'competitive.js'];
            const edits = {
              'api/competitive.js': [
                ["const RANKS = ['Scalar', 'Integer', 'Prime', 'Vector', 'Matrix', 'Euler', 'Gauss', 'Infinity'];", "const RANKS = ['Rookie', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Master', 'Grandmaster', 'Mathematician'];"],
                ["const COLORS = ['#8a8aa8','#72a0ff','#b26cff','#40e0f0','#f0e040','#40f070','#f09040','#f04070'];", "const COLORS = ['#8a8aa8','#a66a3f','#c0c0c0','#f0d84a','#40e0d0','#5a8cff','#b06cff','#f06ca8','#ff8a40'];"],
                ["function rankName(rankIndex) {\n  if (rankIndex < 0) return 'Placement';\n  if (rankIndex >= 21) return 'Infinity';\n  const r = RANKS[Math.floor(rankIndex / 3)];\n  const tier = ['III','II','I'][rankIndex % 3];\n  return `${r} ${tier}`;\n}\n\nfunction rankIndexFromMmr(mmr) {\n  if (mmr >= 2200) return 21;\n  return Math.max(0, Math.min(20, Math.floor((mmr - 800) / 100)));\n}", "function rankName(rankIndex) {\n  if (rankIndex < 0) return 'Placement';\n  if (rankIndex >= 24) return 'Mathematician';\n  const r = RANKS[Math.floor(rankIndex / 3)];\n  const tier = ['III','II','I'][rankIndex % 3];\n  return `${r} ${tier}`;\n}\n\nfunction rankIndexFromMmr(mmr) {\n  if (mmr >= 2500) return 24;\n  return Math.max(0, Math.min(23, Math.floor((mmr - 700) / 75)));\n}"],
                ["const local = Math.max(0, profile.mmr - (800 + profile.rankIndex * 100));", "const local = Math.max(0, profile.mmr - (700 + profile.rankIndex * 75));"],
                ["while (profile.rr >= 100 && profile.rankIndex < 21)", "while (profile.rr >= 100 && profile.rankIndex < 24)"],
              ],
              'competitive.js': [
                ["const ranks = ['Scalar','Integer','Prime','Vector','Matrix','Euler','Gauss','Infinity'];", "const ranks = ['Rookie','Bronze','Silver','Gold','Platinum','Diamond','Master','Grandmaster','Mathematician'];"],
                ["const rankColor = i => ['#8a8aa8','#72a0ff','#b26cff','#40e0f0','#f0e040','#40f070','#f09040','#f04070'][Math.min(7, Math.max(0, Math.floor(Math.max(0,i)/3)))];", "const rankColor = i => ['#8a8aa8','#a66a3f','#c0c0c0','#f0d84a','#40e0d0','#5a8cff','#b06cff','#f06ca8','#ff8a40'][Math.min(8, Math.max(0, Math.floor(Math.max(0,i)/3)))];"],
                ["if (Number(p.rankIndex) >= 21) return 'Infinity';", "if (Number(p.rankIndex) >= 24) return 'Mathematician';"],
                ["${i===7?'∞ RR':'III · II · I'}", "${i===8?'TOP RANK':'III · II · I'}"],
              ]
            };
            const updated = [];
            for (const path of files) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              const text = Buffer.from(r.data.content, 'base64').toString('utf8');
              let next = text;
              for (const [oldText, newText] of edits[path]) {
                const count = next.split(oldText).length - 1;
                if (count !== 1) throw new Error(`${path}: expected 1 match, found ${count}`);
                next = next.replace(oldText, newText);
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: 'main',
                message: `Rombak competitive rank system [skip-rank-names]`,
                content: Buffer.from(next, 'utf8').toString('base64'),
                sha: r.data.sha,
              });
              updated.push(path);
            }
            core.info(`Updated ${updated.join(', ')}`);

      - name: Validate rank names
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const path of ['api/competitive.js', 'competitive.js']) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              const text = Buffer.from(r.data.content, 'base64').toString('utf8');
              for (const oldName of ['Scalar','Integer','Prime','Vector','Matrix','Euler','Gauss','Infinity']) {
                if (text.includes(oldName)) throw new Error(`${path}: old rank name remains: ${oldName}`);
              }
              core.info(`${path}: rank names validated`);
            }