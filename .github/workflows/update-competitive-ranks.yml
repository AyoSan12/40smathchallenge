name: Update competitive ranks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[skip-rank-names]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run deterministic migration
        run: python scripts/migrate_rank_names.py
