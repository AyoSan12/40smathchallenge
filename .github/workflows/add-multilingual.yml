          };
          function t(k,...a){const d=I18N[currentLang]||I18N.en,v=d[k]??I18N.en[k]??k;return typeof v==='function'?v(...a):v;}
          function setText(s,k){const e=document.querySelector(s);if(e)e.textContent=t(k);}
          function applyLanguage(l){currentLang=I18N[l]?l:'en';document.documentElement.lang=currentLang;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===currentLang));document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
            setText('.op-card[data-op="multiplication"] .op-label','opMultiply');setText('.op-card[data-op="addition"] .op-label','opAdd');setText('.op-card[data-op="subtraction"] .op-label','opSubtract');setText('.op-card[data-op="division"] .op-label','opDivide');setText('.op-card[data-op="mixed"] .op-label','opMixed');
            setText('.diff-card[data-diff="easy"] .diff-name','easy');setText('.diff-card[data-diff="normal"] .diff-name','normal');setText('.diff-card[data-diff="hard"] .diff-name','hard');setText('.diff-card[data-diff="human_calculator"] .diff-name','humanCalculator');
            setText('.diff-card[data-diff="easy"] .diff-badge','easyBadge');setText('.diff-card[data-diff="normal"] .diff-badge','normalBadge');setText('.diff-card[data-diff="hard"] .diff-badge','hardBadge');setText('.diff-card[data-diff="human_calculator"] .diff-badge','hcBadge');
            setText('.diff-card[data-diff="easy"] .diff-desc','easyDesc');setText('.diff-card[data-diff="normal"] .diff-desc','normalDesc');setText('.diff-card[data-diff="hard"] .diff-desc','hardDesc');setText('.diff-card[data-diff="human_calculator"] .diff-desc','hcDesc');
            const tabs=document.querySelectorAll('.tab-btn');['easy','normal','hard','human_calculator'].forEach((k,i)=>{if(tabs[i])tabs[i].textContent=t(k==='human_calculator'?'humanCalculator':k);});
            const g=document.getElementById('diff-greeting');if(g)g.textContent=state.username?t('ready',state.username):t('readyPlayer');
            renderAchievements();renderLeaderboard(state.activeTab);renderProfile();
          }
          renderAchievements=(function(){return function(){const grid=document.getElementById('ach-grid'),count=document.getElementById('ach-count');if(!grid||!profile)return;grid.innerHTML=ACHIEVEMENTS.map(a=>{const x=I18N[currentLang].ach?.[a.id]||I18N.en.ach[a.id],u=profile.achievements.includes(a.id);return `<div class="ach-item ${u?'unlocked':''}" title="${escHtml(x[0])} — ${escHtml(x[1])}"><span class="ach-icon">${a.icon}</span><span class="ach-name">${escHtml(x[0])}</span><span class="ach-desc">${escHtml(x[1])}</span></div>`}).join('');if(count)count.textContent=profile.achievements.length;};})();
          renderLeaderboard=(function(){return function(tab){const list=document.getElementById('leaderboard-list'),entries=state.leaderboard[tab]||[];if(!list)return;if(!entries.length){list.innerHTML=`<div class="lb-empty">${t('noScores')}</div>`;return;}list.innerHTML=entries.map((e,i)=>`<div class="lb-row"><div class="lb-rank">${i+1}</div><div class="lb-name">${escHtml(e.username)}</div><div class="lb-stats">${e.correct}/20</div><div class="lb-score">${e.score.toLocaleString()}</div></div>`).join('');};})();
          showCheatWarning=(function(){return function(isFinal){const o=document.getElementById('cheat-overlay'),title=document.getElementById('cheat-title'),msg=document.getElementById('cheat-msg'),btn=document.getElementById('cheat-continue-btn');if(isFinal){title.textContent=t('scoreVoided');msg.textContent=t('finalCheat');btn.textContent=t('seeResults');btn.onclick=()=>{o.classList.remove('show');showResults();};}else{title.textContent=t('warning');msg.textContent=t('firstWarning');btn.textContent=t('understood');btn.onclick=()=>o.classList.remove('show');}o.classList.add('show');};})();
          async function detectNetworkLanguage(){try{const r=await fetch('/api/locale',{cache:'no-store'});if(r.ok){const d=await r.json();if(I18N[d.language])return d.language;}}catch(e){}const n=(navigator.language||'en').toLowerCase();return n.startsWith('id')?'id':n.startsWith('ja')?'ja':n.startsWith('ko')?'ko':'en';}
          async function initLanguage(){const saved=localStorage.getItem(LANG_KEY);if(saved&&I18N[saved]){applyLanguage(saved);return;}applyLanguage('en');applyLanguage(await detectNetworkLanguage());}
          document.addEventListener('click',e=>{const b=e.target.closest('.lang-btn');if(!b)return;localStorage.setItem(LANG_KEY,b.dataset.lang);applyLanguage(b.dataset.lang);});
          initLanguage();
          '''
              s=s.replace('</script>\n</body>',js+'\n</script>\n</body>',1)
              p.write_text(s,encoding='utf-8')
