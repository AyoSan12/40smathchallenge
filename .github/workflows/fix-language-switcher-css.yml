name: Fix language switcher CSS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip lang-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  'transform:translateX(-50%).settings-btn{top:10px;right:10px}',
                  'transform:translateX(-50%)}.settings-btn{top:10px;right:10px}'
              ),
              (
                  'transform:translateX(-50%).settings-btn',
                  'transform:translateX(-50%)}.settings-btn'
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          p.write_text(s, encoding='utf-8')
          print('changed=', changed)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          rm .github/workflows/fix-language-switcher-css.yml
          git add .github/workflows/fix-language-switcher-css.yml
          if git diff --cached --quiet; then
            echo 'No CSS fix needed.'
            exit 0
          fi
          git commit -m 'Repair language switcher CSS [skip lang-fix]'
          git push
